<script>
let API_KEY = "", PROJECT = "", ADMINS = [];
try{ localStorage.removeItem('igua_api_key'); localStorage.removeItem('igua_project'); }catch(e){}
const $ = id => document.getElementById(id);
try{ const cfg=JSON.parse($('cfg').textContent); API_KEY=String(cfg.apiKey||'').trim(); PROJECT=String(cfg.project||'').trim(); ADMINS=(cfg.admins||[]).map(e=>String(e).trim().toLowerCase()); }catch(e){}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const POR_PAG = 100;
const CAMPO_DESC = 'Descrição do Serviço';
let token = null, refresh = null, expira = 0;
let dados = [], colunas = [], filtrado = [], pagina = 0, ordem = {col:null, asc:true};
let diasBuscados = new Set();          // dias (AAAA-MM-DD) já buscados na coleção atual
let calMes = new Date(); calMes.setDate(1);
let syncLocal = {};                    // dia -> {em, por}: versão compartilhada já aplicada neste navegador
let indiceRemoto = {};                 // dia -> {em, por}: dias já compartilhados no Firebase (índice)
let trab = false, ultSync = 0;         // trab = operação em andamento
const SYNC_COL = 'painel_sync';        // coleção do Firestore usada para compartilhar entre usuários

// ---------- Cache local (IndexedDB) ----------
// Guarda os registros já baixados de cada coleção no navegador, para
// não precisar ler o Firebase de novo toda vez que a página abrir.
function abrirDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('igua_painel_cache',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('colecoes');
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}
async function cacheLer(col){
  try{
    const db=await abrirDB();
    return await new Promise((res,rej)=>{
      const rq=db.transaction('colecoes').objectStore('colecoes').get(col);
      rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
    });
  }catch(e){return null;}
}
async function cacheGravar(col,registros,dias,sync){
  try{
    const db=await abrirDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction('colecoes','readwrite');
      tx.objectStore('colecoes').put({registros,diasBuscados:[...dias],sync:sync||{},atualizadoEm:Date.now()},col);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){console.warn('Não foi possível gravar o cache:',e);}
}
async function cacheApagar(col){
  try{
    const db=await abrirDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction('colecoes','readwrite');
      tx.objectStore('colecoes').delete(col);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}

// ---------- Tradução de erros ----------
function traduzirErro(m){
  const s=String(m||'');
  const t=[
    [/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/,'E-mail ou senha incorretos.'],
    [/INVALID_EMAIL/,'E-mail inválido.'],
    [/MISSING_PASSWORD|MISSING_EMAIL/,'Informe e-mail e senha.'],
    [/USER_DISABLED/,'Usuário desativado. Fale com o administrador.'],
    [/TOO_MANY_ATTEMPTS/,'Muitas tentativas. Aguarde alguns minutos e tente de novo.'],
    [/OPERATION_NOT_ALLOWED/,'Login por e-mail/senha não está habilitado no projeto.'],
    [/referer|are blocked/i,'Chave de API bloqueada para este endereço (restrição de referrer). Confira no Google Cloud.'],
    [/API key not valid|API_KEY_INVALID|INVALID_API_KEY/i,'Chave de API inválida.'],
    [/Missing or insufficient permissions|PERMISSION_DENIED/i,'Sem permissão para ler os dados. Confira as regras do Firestore e se seu usuário está autorizado.'],
    [/UNAUTHENTICATED|TOKEN_EXPIRED|INVALID_ID_TOKEN|INVALID_REFRESH_TOKEN/i,'Sessão expirada. Entre novamente.'],
    [/Quota exceeded|RESOURCE_EXHAUSTED/i,'Cota diária do Firebase esgotada (leituras, gravações ou exclusões). Tente mais tarde.'],
    [/not found or deleted|PROJECT_NOT_FOUND/i,'Projeto não encontrado. Confira o ID do projeto.'],
    [/Failed to fetch|NetworkError|Load failed/i,'Falha de conexão. Verifique a internet.']
  ];
  for(const [r,txt] of t) if(r.test(s)) return txt;
  return s||'Erro desconhecido.';
}

// ---------- Autenticação ----------
let emailLogado='';
async function login(email, senha){
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password:senha,returnSecureToken:true})});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || 'Falha no login');
  token=j.idToken; refresh=j.refreshToken; expira=Date.now()+(+j.expiresIn*1000)-60000;
  emailLogado=String(j.email||email).trim().toLowerCase();
}
async function getToken(){
  if(Date.now()<expira) return token;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(refresh)}`});
  const j = await r.json();
  if(!r.ok) throw new Error('Sessão expirada, entre novamente.');
  token=j.id_token; refresh=j.refresh_token; expira=Date.now()+(+j.expires_in*1000)-60000;
  return token;
}

// ---------- Firestore ----------
function valor(v){
  if(!v||typeof v!=='object') return '';
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('timestampValue' in v) return v.timestampValue;
  if('nullValue' in v) return '';
  if('referenceValue' in v) return String(v.referenceValue).split('/documents/').pop();
  if('geoPointValue' in v) return `${v.geoPointValue.latitude}, ${v.geoPointValue.longitude}`;
  if('bytesValue' in v) return v.bytesValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(valor).join(', ');
  if('mapValue' in v){
    const o={}, f=v.mapValue.fields||{};
    for(const k in f) o[k]=valor(f[k]);
    return JSON.stringify(o);
  }
  return '';
}
// Descrição em branco = registro descartado (não serve).
function temDescricao(o){
  return String(o[CAMPO_DESC] ?? '').trim() !== '';
}
function docParaObjeto(d){
  const o={_id:d.name.split('/').pop()};
  for(const k in d.fields) o[k]=valor(d.fields[k]);
  return o;
}
// Lê só os documentos de uma data de referência (gasta bem menos leituras).
async function carregarPorData(col,dataISO){
  const t = await getToken();
  const r = await fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents:runQuery`,{
    method:'POST',
    headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{
      from:[{collectionId:col}],
      where:{fieldFilter:{field:{fieldPath:'_dataReferenciaImportacao'},op:'EQUAL',value:{stringValue:dataISO}}}
    }})});
  const j = await r.json();
  if(!r.ok) throw new Error((Array.isArray(j)?j[0]?.error?.message:j.error?.message) || 'Erro ao consultar o Firestore');
  const out=[];
  (j||[]).forEach(x=>{ if(x.document){ const o=docParaObjeto(x.document); if(temDescricao(o)) out.push(o); } });
  return out;
}

// ---------- Compartilhamento entre usuários ----------
// Quando alguém busca um dia, o resultado é gravado em "painel_sync" (poucos
// documentos). Os outros usuários baixam esse resultado em vez de consultar
// a coleção original, e o dia fica verde no calendário de todos.
const baseDocs = () => `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
async function gravarDoc(id,fields,mask){
  const t = await getToken();
  const url = `${baseDocs()}/${SYNC_COL}/${encodeURIComponent(id)}`+(mask?`?updateMask.fieldPaths=${encodeURIComponent(mask)}`:'');
  const r = await fetch(url,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error?.message || 'Erro ao gravar no Firestore');
}
// Divide os registros em blocos pequenos (limite de 1 MB por documento).
function dividirBlocos(regs){
  const TAM=250000, blocos=[]; let atual=[], n=0;
  for(const r of regs){
    const t=JSON.stringify(r).length;
    if(atual.length && n+t>TAM){ blocos.push(atual); atual=[]; n=0; }
    atual.push(r); n+=t;
  }
  if(atual.length) blocos.push(atual);
  return blocos;
}
async function publicarDia(col,dia,regs,em,por){
  const blocos=dividirBlocos(regs);
  let bytes=0;
  for(let i=0;i<blocos.length;i++){
    const js=JSON.stringify(blocos[i]); bytes+=js.length+100;
    await gravarDoc(`dia-${col}-${dia}-${i}`,{json:{stringValue:js}});
  }
  // O índice é gravado por último: ninguém vê o dia antes dos dados estarem prontos.
  await gravarDoc(`idx-${col}`,
    {dias:{mapValue:{fields:{[dia]:{mapValue:{fields:{
      chunks:{integerValue:String(blocos.length)},total:{integerValue:String(regs.length)},bytes:{integerValue:String(bytes)},
      por:{stringValue:por},em:{stringValue:em}}}}}}}},
    'dias.`'+dia+'`');
  return bytes;
}
async function lerIndice(col){
  const t = await getToken();
  const r = await fetch(`${baseDocs()}/${SYNC_COL}/${encodeURIComponent('idx-'+col)}`,{headers:{Authorization:'Bearer '+t}});
  if(r.status===404) return {};
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message || 'Erro ao ler o índice compartilhado');
  const f=j.fields?.dias?.mapValue?.fields||{}, out={};
  for(const dia in f){
    const m=f[dia].mapValue?.fields||{};
    out[dia]={em:m.em?.stringValue||'',por:m.por?.stringValue||'',chunks:Number(m.chunks?.integerValue||0),total:Number(m.total?.integerValue||0),bytes:Number(m.bytes?.integerValue||0)};
  }
  return out;
}
async function baixarDia(col,dia,info){
  if(!info.chunks) return [];
  const prefixo=`projects/${PROJECT}/databases/(default)/documents/${SYNC_COL}/`;
  const docs=[]; for(let i=0;i<info.chunks;i++) docs.push(`${prefixo}dia-${col}-${dia}-${i}`);
  const t = await getToken();
  const r = await fetch(`${baseDocs()}:batchGet`,{method:'POST',
    headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({documents:docs})});
  const j = await r.json();
  if(!r.ok) throw new Error((Array.isArray(j)?j[0]?.error?.message:j.error?.message) || 'Erro ao ler dados compartilhados');
  const partes=[];
  (j||[]).forEach(x=>{ if(x.found){ partes[+x.found.name.split('-').pop()]=JSON.parse(x.found.fields.json.stringValue); } });
  for(let i=0;i<info.chunks;i++) if(!partes[i]) throw new Error(`Dados compartilhados do dia ${dia} incompletos. Tente sincronizar de novo.`);
  return partes.flat();
}
async function sincronizar(manual,mes){
  if(!token) return;
  if(trab && !mes){ if(manual) $('sinc').textContent='Aguarde: há outra operação em andamento.'; return; }
  while(trab) await new Promise(r=>setTimeout(r,200));
  const col=$('colecao').value;
  trab=true; $('colecao').disabled=true; $('fMes').disabled=true; ultSync=Date.now();
  const hora=new Date().toLocaleTimeString('pt-BR');
  try{
    const idx=await lerIndice(col);           // 1 leitura: só o índice dos dias compartilhados
    indiceRemoto=idx;
    const desatual=d=>!syncLocal[d] || String(syncLocal[d].em)<String(idx[d].em);
    // Baixa os dias do mês escolhido + atualiza dias que já estão aqui mas foram rebuscados por outro usuário.
    const pend=Object.keys(idx).filter(d=>desatual(d) && ((mes&&d.startsWith(mes)) || diasBuscados.has(d))).sort();
    for(const dia of pend){
      $('sinc').textContent=`Baixando ${dia.split('-').reverse().join('/')} (${pend.indexOf(dia)+1}/${pend.length})…`;
      const regs=await baixarDia(col,dia,idx[dia]);
      dados=dados.filter(o=>o._dataReferenciaImportacao!==dia).concat(regs.filter(temDescricao));
      diasBuscados.add(dia); syncLocal[dia]={em:idx[dia].em,por:idx[dia].por};
    }
    if(pend.length) await cacheGravar(col,dados,diasBuscados,syncLocal);
    renderCal();
    if(pend.length){ montarFiltros(); aplicar(); } else opcoesMes();
    if(mes){
      const rot=`${mes.slice(5)}/${mes.slice(0,4)}`;
      const temAlgo=Object.keys(idx).some(d=>d.startsWith(mes)) || dados.some(o=>String(o._dataReferenciaImportacao||'').startsWith(mes));
      $('sinc').textContent = pend.length ? `Mês ${rot}: ${pend.length} dia(s) baixado(s) do que outros usuários compartilharam (${hora}).`
        : temAlgo ? `Mês ${rot}: tudo já estava atualizado (${hora}).`
        : `Mês ${rot}: nenhum dia foi compartilhado ainda. Busque os dias que faltam pela data.`;
    }else{
      $('sinc').textContent = `Sincronizado às ${hora}.`+(pend.length?` ${pend.length} dia(s) atualizado(s).`:'');
    }
  }catch(e){ console.error(e); $('sinc').textContent='Sincronização: '+traduzirErro(e.message); }
  finally{ trab=false; $('colecao').disabled=false; $('fMes').disabled=false; }
}
function tituloDia(s){
  const i=syncLocal[s]||indiceRemoto[s];
  if(!diasBuscados.has(s) && !indiceRemoto[s]) return 'Ainda não buscado';
  const quem=i&&i.por?`Buscado por ${i.por} em ${new Date(i.em).toLocaleString('pt-BR')}`:'Já buscado';
  return diasBuscados.has(s) ? quem : quem+' (escolha o mês para carregar)';
}

// ---------- UI ----------
function fmt(v){
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d=new Date(v); if(!isNaN(d)) return d.toLocaleString('pt-BR');
  }
  return v ?? '';
}
function opcoes(sel,campo,filtro){

const NOMES_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function opcoesMes(){

}
function montarFiltros(){
  opcoesMes(); opcoesData(); opcoes('fServ',CAMPO_DESC);
  opcoes('fCid','Cidade'); opcoes('fRec','Recurso');
  const pref=['Data','Recurso','Ordem de Serviço',CAMPO_DESC,'Cidade','Hidrômetro','Status da Atividade','Fim do SLA'];
  const todas=new Set(); dados.forEach(d=>Object.keys(d).forEach(k=>todas.add(k)));
  todas.delete('_id');
  colunas=[...pref.filter(c=>todas.has(c)),...[...todas].filter(c=>!pref.includes(c)).sort()];
}
function aplicar(){
  const q=$('busca').value.trim().toLowerCase();
  const mes=$('fMes').value;
  const f={_dataReferenciaImportacao:$('fData').value,[CAMPO_DESC]:$('fServ').value,Cidade:$('fCid').value,Recurso:$('fRec').value};
  filtrado=dados.filter(d=>{
    if(mes && !String(d._dataReferenciaImportacao||'').startsWith(mes)) return false;
    for(const k in f) if(f[k] && String(d[k])!==f[k]) return false;
    if(q && !colunas.some(c=>String(d[c]??'').toLowerCase().includes(q))) return false;
    return true;
  });
  if(ordem.col){
    const c=ordem.col;
    filtrado.sort((a,b)=>{
      const x=a[c]??'',y=b[c]??'';
      const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),'pt-BR',{numeric:true});
      return ordem.asc?r:-r;
    });
  }
  pagina=0; render();
}
function contar(campo,lista){
  const m={}; lista.forEach(d=>{const k=String(d[campo]).trim(); m[k]=(m[k]||0)+1;}); return m;
}
function desenharBarras(idEl,campo,lista){
  const cont=contar(campo,lista);
  const top=Object.entries(cont).sort((a,b)=>b[1]-a[1]);
  const max=top[0]?.[1]||1;
  $(idEl).innerHTML=top.map(([k,n])=>`<div><span class="nome">${esc(k===''||k==='undefined'?'(vazio)':k)}</span><span class="trilho"><i style="width:${n/max*100}%"></i></span><span>${n}</span></div>`).join('');
}

// ---------- Calendário dos dias já buscados ----------
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function renderCal(){
  const y=calMes.getFullYear(), m=calMes.getMonth();
  const titulo=new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const primeiro=new Date(y,m,1).getDay(), total=new Date(y,m+1,0).getDate();
  const hoje=isoLocal(new Date()), sel=$('dataBuscar').value;

  ['D','S','T','Q','Q','S','S'].forEach(s=>h+=`<span class="sem">${s}</span>`);
  for(let i=0;i<primeiro;i++) h+='<span></span>';
  for(let d=1;d<=total;d++){
    const s=`${y}-${pad(m+1)}-${pad(d)}`;
    const cls=['dia',(diasBuscados.has(s)||indiceRemoto[s])?'ok':'',s===hoje?'hoje':'',s===sel?'sel':''].join(' ');
    h+=`<button type="button" class="${cls}" data-d="${s}" title="${esc(tituloDia(s))}">${d}</button>`;
  }
  h+='</div><div class="leg"><i></i> dia já buscado por você ou por outro usuário (clique para escolher a data)</div>';
  $('cal').innerHTML=h;
}

async function mostrarCache(){

  const c=await cacheLer(col);
  dados=((c&&c.registros)||[]).filter(temDescricao);

}

// ---------- Armazenamento do Firebase (estimativa) + apagar mês (só admin) ----------
// Atenção: esconder o card é só visual. Quem bloqueia de verdade são as regras do Firestore.
const ehAdmin=()=>!!emailLogado&&ADMINS.includes(emailLogado);
// O Firestore não informa o espaço total usado a quem acessa pelo navegador.
// Por isso o valor é ESTIMADO: nº de documentos x tamanho médio x fator (os
// índices também ocupam espaço). Use o botão ⚙ para calibrar o fator com o
// número real que aparece no console do Firebase (Firestore > Uso).
const COLS_ORIG=['atividades_corte_religacao','camel_fiscalizacao_sul'];
let limiteBytes=1073741824, fatorUso=2, ultBruto=0, usando=false;
try{
  const l=+localStorage.getItem('igua_limite_bytes'), f=+localStorage.getItem('igua_fator_uso');
  if(l>0) limiteBytes=l; if(f>0) fatorUso=f;
}catch(e){}
const mediaDoc={};
function fmtBytes(b){
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
async function postar(url,corpo){
  const t=await getToken();
  const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((Array.isArray(j)?j[0]?.error?.message:j.error?.message) || 'Erro ao falar com o Firestore');
  return j;
}
function filtroMes(mes,prox){
  return {compositeFilter:{op:'AND',filters:[
    {fieldFilter:{field:{fieldPath:'_dataReferenciaImportacao'},op:'GREATER_THAN_OR_EQUAL',value:{stringValue:mes+'-01'}}},
    {fieldFilter:{field:{fieldPath:'_dataReferenciaImportacao'},op:'LESS_THAN',value:{stringValue:prox}}}]}};
}
function proxMes(mes){
  const [y,m]=mes.split('-').map(Number);
  return m===12?`${y+1}-01-01`:`${y}-${pad(m+1)}-01`;
}
async function contarDocs(col,where){
  const sq={from:[{collectionId:col}]}; if(where) sq.where=where;
  const j=await postar(`${baseDocs()}:runAggregationQuery`,{structuredAggregationQuery:{structuredQuery:sq,aggregations:[{alias:'n',count:{}}]}});
  return Number(j[0]?.result?.aggregateFields?.n?.integerValue||0);
}
// Tamanho médio de um documento: usa o cache local; sem cache, lê uma amostra de 20.
async function mediaDocumento(col){
  if(mediaDoc[col]) return mediaDoc[col];
  let amostra=[];
  const c=await cacheLer(col);
  if(c&&c.registros&&c.registros.length) amostra=c.registros.slice(0,300);
  else{
    const t=await getToken();
    const r=await fetch(`${baseDocs()}/${col}?pageSize=20`,{headers:{Authorization:'Bearer '+t}});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error?.message||'Erro ao ler amostra do Firestore');
    amostra=(j.documents||[]).map(docParaObjeto);
  }
  if(!amostra.length) return 0;
  const m=amostra.reduce((s,o)=>s+JSON.stringify(o).length+100,0)/amostra.length;
  mediaDoc[col]=m; return m;
}
async function atualizarUso(){
  if(!token||usando||!ehAdmin()) return;
  usando=true; $('usoBtn').disabled=true; $('usoTxt').textContent='Calculando…';
  try{
    let orig=0, sync=0;
    for(const col of COLS_ORIG){
      const n=await contarDocs(col), m=await mediaDocumento(col);
      orig+=n*m;
      const idx=await lerIndice(col);
      for(const d in idx) sync+=idx[d].bytes||(idx[d].total*m);
    }
    ultBruto=orig+sync;
    const total=ultBruto*fatorUso, pct=total/limiteBytes*100;
    $('usoFill').style.width=Math.min(100,pct).toFixed(1)+'%';
    $('usoFill').className=pct>=90?'alto':pct>=70?'mid':'';
    $('usoTxt').textContent=`≈ ${fmtBytes(total)} de ${fmtBytes(limiteBytes)} (${pct.toFixed(1)}%) · dados originais ≈ ${fmtBytes(orig*fatorUso)} · cópia compartilhada ≈ ${fmtBytes(sync*fatorUso)} · estimativa (confira no console do Firebase e calibre em ⚙)`;
  }catch(e){
    console.error(e); $('usoFill').style.width='0'; $('usoTxt').textContent='Não foi possível estimar o espaço: '+traduzirErro(e.message);
  }
  finally{ usando=false; $('usoBtn').disabled=false; }
}
function ajustarUso(){
  const l=prompt('Limite de armazenamento em GB (plano gratuito = 1):',String(+(limiteBytes/1073741824).toFixed(2)));
  if(l===null) return;
  const gb=parseFloat(String(l).replace(',','.'));
  if(gb>0) limiteBytes=gb*1073741824;
  const r=prompt(`Calibrar (opcional): quantos MB de armazenamento o console do Firebase mostra agora? Deixe vazio para manter o fator atual (${fatorUso.toFixed(2)}).`,'');
  const real=parseFloat(String(r||'').replace(',','.'));
  if(real>0 && ultBruto>0) fatorUso=real*1048576/ultBruto;
  try{ localStorage.setItem('igua_limite_bytes',String(limiteBytes)); localStorage.setItem('igua_fator_uso',String(fatorUso)); }catch(e){}
  atualizarUso();
}
async function excluirDocs(nomes){
  for(let i=0;i<nomes.length;i+=400)
    await postar(`${baseDocs()}:commit`,{writes:nomes.slice(i,i+400).map(n=>({delete:n}))});
}
// Tira os dias do índice compartilhado (a máscara sem valor apaga o campo).
async function removerDoIndice(col,dias){
  if(!dias.length) return;
  const t=await getToken();
  const mask=dias.map(d=>'updateMask.fieldPaths='+encodeURIComponent('dias.`'+d+'`')).join('&');
  const r=await fetch(`${baseDocs()}/${SYNC_COL}/${encodeURIComponent('idx-'+col)}?${mask}`,
    {method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:{}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error?.message||'Erro ao atualizar o índice compartilhado');
}
async function apagarOriginais(col,mes,prox,progresso){
  let total=0;
  for(;;){
    const j=await postar(`${baseDocs()}:runQuery`,{structuredQuery:{
      from:[{collectionId:col}],select:{fields:[{fieldPath:'__name__'}]},where:filtroMes(mes,prox),limit:500}});
    const nomes=(j||[]).filter(x=>x.document).map(x=>x.document.name);
    if(!nomes.length) break;
    await excluirDocs(nomes); total+=nomes.length; progresso(total);
    if(nomes.length<500) break;
  }
  return total;
}
async function apagarMes(){
  const mes=$('mesApagar').value;
  if(!token||!ehAdmin()) return;
  if(!/^\d{4}-\d{2}$/.test(mes)){ $('msg').classList.add('err'); $('msg').textContent='Escolha o mês que deseja apagar.'; return; }
  const col=$('colecao').value, orig=$('apagarOrig').checked;
  const rot=`${mes.slice(5)}/${mes.slice(0,4)}`, nome=$('colecao').selectedOptions[0].textContent, prox=proxMes(mes);
  $('apagarBtn').disabled=true; $('msg').classList.remove('err'); $('msg').textContent='Conferindo o que será apagado…';
  try{
    const idx=await lerIndice(col);
    const dias=Object.keys(idx).filter(d=>d.startsWith(mes));
    const nOrig=orig?await contarDocs(col,filtroMes(mes,prox)):0;
    if(!dias.length && !nOrig){
      $('msg').textContent=orig?`Não há dados de ${rot} em "${nome}".`:`Não há cópia compartilhada de ${rot}. Marque a opção dos dados originais para apagar do Firebase.`;
      return;
    }
    let txt=`Apagar ${rot} de "${nome}"?\n\n• Cópia compartilhada: ${dias.length} dia(s)`;
    txt+=orig?`\n• Dados ORIGINAIS no Firebase: ${nOrig} documento(s) — NÃO dá para desfazer`
             :`\n(Os dados originais não serão apagados; o mês poderá ser buscado de novo.)`;
    txt+=`\n\nTambém sai do cache deste navegador. Digite ${rot} para confirmar:`;
    if(prompt(txt)!==rot){ $('msg').textContent='Cancelado. Nada foi apagado.'; return; }
    while(trab) await new Promise(r=>setTimeout(r,200));
    trab=true; $('colecao').disabled=true; $('fMes').disabled=true;
    try{
      // Primeiro some do índice (ninguém vê o dia sem dados), depois apaga os blocos.
      $('msg').textContent='Apagando a cópia compartilhada…';
      await removerDoIndice(col,dias);
      const prefixo=`projects/${PROJECT}/databases/(default)/documents/${SYNC_COL}/`, blocos=[];
      dias.forEach(d=>{ for(let i=0;i<idx[d].chunks;i++) blocos.push(`${prefixo}dia-${col}-${d}-${i}`); });
      await excluirDocs(blocos);
      let apagados=0;
      if(orig) apagados=await apagarOriginais(col,mes,prox,n=>{ $('msg').textContent=`Apagando dados originais… ${n} de ${nOrig}`; });
      // Limpa também o cache e a tela deste navegador.
      const no=d=>String(d||'').startsWith(mes);
      dados=dados.filter(o=>!no(o._dataReferenciaImportacao));
      [...diasBuscados].filter(no).forEach(d=>diasBuscados.delete(d));
      Object.keys(syncLocal).filter(no).forEach(d=>delete syncLocal[d]);
      Object.keys(indiceRemoto).filter(no).forEach(d=>delete indiceRemoto[d]);
      await cacheGravar(col,dados,diasBuscados,syncLocal);
      if($('fMes').value===mes) $('fMes').value='';
      renderCal(); montarFiltros(); aplicar();
      $('msg').textContent=`${rot} apagado: ${dias.length} dia(s) da cópia compartilhada`+(orig?` e ${apagados} documento(s) originais`:'')+'. Os outros usuários podem manter esse mês no cache deles até limparem.';
      atualizarUso();
    }finally{ trab=false; $('colecao').disabled=false; $('fMes').disabled=false; }
  }catch(e){ console.error(e); $('msg').classList.add('err'); $('msg').textContent='Não foi possível apagar: '+traduzirErro(e.message)+' (o que já foi apagado não volta; rode de novo para continuar).'; }
  finally{ $('apagarBtn').disabled=false; }
}

$('carregar').onclick=async()=>{
  const dia0=$('dataBuscar').value;
  if(!dia0){ $('msg').textContent='Escolha uma data para buscar.'; $('msg').classList.add('err'); return; }
  if(diasBuscados.has(dia0)||indiceRemoto[dia0]){
    const i=syncLocal[dia0]||indiceRemoto[dia0], quem=i&&i.por?` por ${i.por}`:'';
    if(!confirm(`O dia ${dia0.split('-').reverse().join('/')} já foi buscado${quem}. Buscar de novo (gasta leituras do Firebase)?`)) return;
  }
  $('carregar').disabled=true; $('msg').classList.remove('err');
  while(trab) await new Promise(r=>setTimeout(r,200));
  trab=true; $('colecao').disabled=true;
  try{
    const col=$('colecao').value, dia=dia0;
    $('msg').textContent='Buscando…';
    const novos = await carregarPorData(col,dia);
    // Troca só os registros daquele dia (apagados no Firebase saem).
    const c=await cacheLer(col);
    const base=((c&&c.registros)||[]).filter(o=>o._dataReferenciaImportacao!==dia);
    const mapa=new Map(base.map(o=>[o._id,o]));
    novos.forEach(o=>mapa.set(o._id,o));
    const todos=[...mapa.values()].filter(temDescricao);
    diasBuscados.add(dia);
    // Compartilha o dia buscado com os outros usuários (eles não precisam buscar de novo).
    let aviso='';
    const em=new Date().toISOString(), por=$('user').textContent;
    try{
      const bytes=await publicarDia(col,dia,novos,em,por);
      syncLocal[dia]={em,por}; indiceRemoto[dia]={em,por,chunks:0,total:novos.length,bytes};
      aviso=' Dia compartilhado com os outros usuários.';
    }catch(e){ console.error(e); aviso=' Atenção: não foi possível compartilhar com os outros usuários ('+traduzirErro(e.message)+').'; }
    await cacheGravar(col,todos,diasBuscados,syncLocal);
    dados=todos;
    renderCal();
    montarFiltros(); aplicar();
    $('msg').textContent=`${novos.length} registros buscados da data ${dia} às ${new Date().toLocaleTimeString('pt-BR')}. Total no cache: ${dados.length}.${aviso}`;
    atualizarUso();
  }catch(e){console.error(e);$('msg').textContent=traduzirErro(e.message);$('msg').classList.add('err');}
  finally{ trab=false; $('colecao').disabled=false; $('carregar').disabled=false; }
};
// ---------- Buscar o mês inteiro (só os dias que ainda faltam) ----------
const somaDia=(s,n)=>{ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); };
const dmy=s=>s.split('-').reverse().join('/');
async function carregarIntervalo(col,ini,fimExcl){
  const t = await getToken();
  const campo={fieldPath:'_dataReferenciaImportacao'};
  const r = await fetch(`${baseDocs()}:runQuery`,{method:'POST',
    headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],where:{compositeFilter:{op:'AND',filters:[
      {fieldFilter:{field:campo,op:'GREATER_THAN_OR_EQUAL',value:{stringValue:ini}}},
      {fieldFilter:{field:campo,op:'LESS_THAN',value:{stringValue:fimExcl}}}]}}}})});
  const j = await r.json();
  if(!r.ok) throw new Error((Array.isArray(j)?j[0]?.error?.message:j.error?.message) || 'Erro ao consultar o Firestore');
  const out=[];
  (j||[]).forEach(x=>{ if(x.document){ const o=docParaObjeto(x.document); if(temDescricao(o)) out.push(o); } });
  return out;
}
// Agrupa os dias que faltam em janelas de dias seguidos (no máximo 7 por consulta).
function janelasDeDias(dias){
  const jan=[]; let at=[];
  for(const s of dias){
    if(at.length && (somaDia(at[at.length-1],1)!==s || at.length>=7)){ jan.push(at); at=[]; }
    at.push(s);
  }
  if(at.length) jan.push(at);
  return jan;
}
$('buscarMes').onclick=async()=>{
  const ref=$('dataBuscar').value || ($('fMes').value?$('fMes').value+'-01':isoLocal(new Date()));
  const mes=ref.slice(0,7), col=$('colecao').value, rot=`${mes.slice(5)}/${mes.slice(0,4)}`;
  $('buscarMes').disabled=true; $('carregar').disabled=true; $('msg').classList.remove('err');
  try{
    $('msg').textContent=`Mês ${rot}: conferindo o que já foi buscado…`;
    await sincronizar(true,mes);                       // 1º traz o que outros usuários já compartilharam
    const hoje=isoLocal(new Date());
    const total=new Date(+mes.slice(0,4),+mes.slice(5),0).getDate(), faltam=[];
    for(let d=1;d<=total;d++){
      const s=`${mes}-${pad(d)}`; if(s>hoje) break;
      // Dias já buscados não são buscados de novo; só "hoje" é refeito, porque ainda pode receber registros.
      if(s===hoje || !(diasBuscados.has(s)||indiceRemoto[s])) faltam.push(s);
    }
    if(!faltam.length){ $('msg').textContent=`Mês ${rot}: todos os dias já foram buscados. Nada a buscar.`; return; }
    if(!confirm(`Buscar no Firebase ${faltam.length} dia(s) de ${rot} que ainda faltam (gasta leituras)? Os dias já buscados não serão buscados de novo.`)){ $('msg').textContent=''; return; }
    while(trab) await new Promise(r=>setTimeout(r,200));
    trab=true; $('colecao').disabled=true;
    const por=$('user').textContent, jan=janelasDeDias(faltam);
    let regs=0, falhas=0;
    try{
      for(let i=0;i<jan.length;i++){
        const j=jan[i], ult=j[j.length-1];
        $('msg').textContent=`Buscando ${dmy(j[0])}${j.length>1?' a '+dmy(ult):''} (${i+1}/${jan.length})…`;
        const novos=await carregarIntervalo(col,j[0],somaDia(ult,1));
        const porDia={}; j.forEach(d=>porDia[d]=[]);
        novos.forEach(o=>{ const d=o._dataReferenciaImportacao; if(porDia[d]) porDia[d].push(o); });
        const em=new Date().toISOString();
        dados=dados.filter(o=>!porDia[o._dataReferenciaImportacao]).concat(novos);
        for(const d of j){
          // Dia sem registros só é dado como buscado se já passou; "hoje" vazio fica para a próxima busca.
          if(!porDia[d].length && d>=hoje) continue;
          diasBuscados.add(d);
          try{
            const bytes=await publicarDia(col,d,porDia[d],em,por);
            syncLocal[d]={em,por}; indiceRemoto[d]={em,por,chunks:0,total:porDia[d].length,bytes};
          }catch(e){ console.error(e); falhas++; }
        }
        regs+=novos.length;
        await cacheGravar(col,dados,diasBuscados,syncLocal);   // guarda a cada janela: se cair, não perde o que já veio
        renderCal(); montarFiltros(); aplicar();
      }
      $('msg').textContent=`Mês ${rot}: ${regs} registros buscados em ${faltam.length} dia(s), às ${new Date().toLocaleTimeString('pt-BR')}. Total no cache: ${dados.length}.`
        +(falhas?` Atenção: ${falhas} dia(s) não puderam ser compartilhados com os outros usuários.`:' Dias compartilhados com os outros usuários.');
      atualizarUso();
    }finally{ trab=false; $('colecao').disabled=false; }
  }catch(e){ console.error(e); $('msg').textContent=traduzirErro(e.message); $('msg').classList.add('err'); }
  finally{ $('buscarMes').disabled=false; $('carregar').disabled=false; }
};
$('limpar').onclick=async()=>{
  if(!confirm('Apagar os dados em cache desta coleção? Os dias compartilhados por outros usuários serão baixados de novo.')) return;
  await cacheApagar($('colecao').value);
  await mostrarCache();
  sincronizar();
};
$('calBtn').onclick=e=>{
  e.stopPropagation();
  const abrindo=$('cal').classList.contains('hide');
  if(abrindo){
    const sel=$('dataBuscar').value;
    calMes=sel?new Date(sel+'T00:00:00'):new Date(); calMes.setDate(1);
    renderCal();
  }
  $('cal').classList.toggle('hide');
  if(abrindo && Date.now()-ultSync>15000) sincronizar();
};
$('cal').onclick=e=>{
  e.stopPropagation();
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.nav){ calMes=new Date(calMes.getFullYear(),calMes.getMonth()+(+b.dataset.nav),1); renderCal(); return; }
  if(b.dataset.d){
    $('dataBuscar').value=b.dataset.d;
    const br=b.dataset.d.split('-').reverse().join('/');
    $('msg').classList.remove('err');
    $('msg').textContent=(diasBuscados.has(b.dataset.d)||indiceRemoto[b.dataset.d])
      ? `O dia ${br} já foi buscado. Para ver os dados, escolha o mês no filtro "Mês".`
      : `Dia ${br} selecionado (ainda não buscado). Clique em "Buscar no Firebase".`;
    renderCal(); $('cal').classList.add('hide');
  }
};
document.addEventListener('click',()=>$('cal').classList.add('hide'));
['fData','fServ','fCid','fRec'].forEach(i=>$(i).onchange=aplicar);
// Escolher um mês baixa de uma vez todos os dias desse mês que outros usuários já compartilharam.
$('fMes').onchange=async()=>{ const mes=$('fMes').value; if(mes) await sincronizar(true,mes); opcoesData(); aplicar(); };
$('sincBtn').onclick=()=>sincronizar(true);
$('usoBtn').onclick=atualizarUso;
$('usoCfg').onclick=ajustarUso;
$('apagarBtn').onclick=apagarMes;
// Verifica a cada 3 min se outro usuário buscou um dia novo (1 leitura por verificação).
setInterval(()=>{ if(!document.hidden && token) sincronizar(); },180000);
$('busca').oninput=aplicar;
$('xlsx').onclick=exportarXLSX;
$('prev').onclick=()=>{pagina--;render();};
$('next').onclick=()=>{pagina++;render();};
$('thead').onclick=e=>{
  const c=e.target.dataset?.c; if(!c) return;
  ordem={col:c,asc:ordem.col===c?!ordem.asc:true}; aplicar();
};
